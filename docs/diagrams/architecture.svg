<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="830" viewBox="0 0 1560 830" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="830" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">atlas - placement over a fixed slot layer</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">Tenants hash to one of 16384 fixed slots; shards own contiguous ranges - so scaling reassigns ranges, it never reshuffles the keyspace.</text><rect x="50" y="150" width="1460" height="150" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#17509f">1 - PLACEMENT - EVERY REQUEST IS O(1)</text><rect x="74" y="180" width="250" height="87" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(90,195) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4"/><path d="M12 12h9"/><path d="M17 12v4"/><path d="M20 12v3"/></g><text x="120" y="211" font-size="16.5" font-weight="700" fill="#136b74">Tenant id</text><text x="91" y="233.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">e.g. "tenant-42"</text><rect x="461" y="180" width="250" height="87" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(477,195) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14M10 3L8 21M17 3l-2 18"/></g><text x="507" y="211" font-size="16.5" font-weight="700" fill="#552fae">FNV-1a -&gt; slot</text><text x="478" y="233.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">FNV-1a 64-bit, then</text><text x="478" y="250.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">% 16384 -&gt; a slot</text><rect x="848" y="180" width="250" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(864,195) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="894" y="211" font-size="16.5" font-weight="700" fill="#17509f">Owner lookup</text><text x="865" y="233.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">array[slot] -&gt; shard</text><text x="865" y="250.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">contiguous ranges</text><rect x="1235" y="180" width="250" height="87" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1251,195) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="1281" y="211" font-size="16.5" font-weight="700" fill="#186547">Owning shard</text><text x="1252" y="233.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">deterministic,</text><text x="1252" y="250.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">same in every port</text><path d="M324,223 L461,223" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="358.236" y="211.0" width="68.52799999999999" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="392.5" y="227.44" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">id bytes</text><path d="M711,223 L848,223" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="758.124" y="211.0" width="42.751999999999995" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="779.5" y="227.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">slot</text><path d="M1098,223 L1235,223" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="1136.412" y="211.0" width="60.176" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="1166.5" y="227.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">lookup</text><rect x="50" y="342" width="1460" height="132" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="333" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#552fae">THE FIXED SLOT LAYER - 16384 SLOTS, CONTIGUOUS RANGES</text><rect x="74" y="374" width="326" height="66" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><text x="237.0" y="406" text-anchor="middle" font-size="16.5" font-weight="700" fill="#136b74">shard-0</text><text x="237.0" y="427.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">slots 0 - 4095</text><rect x="436" y="374" width="326" height="66" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><text x="599.0" y="406" text-anchor="middle" font-size="16.5" font-weight="700" fill="#17509f">shard-1</text><text x="599.0" y="427.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">slots 4096 - 8191</text><rect x="798" y="374" width="326" height="66" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><text x="961.0" y="406" text-anchor="middle" font-size="16.5" font-weight="700" fill="#186547">shard-2</text><text x="961.0" y="427.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">slots 8192 - 12287</text><rect x="1160" y="374" width="326" height="66" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><text x="1323.0" y="406" text-anchor="middle" font-size="16.5" font-weight="700" fill="#8c5a0d">shard-3</text><text x="1323.0" y="427.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">slots 12288 - 16383</text><path d="M973,267 L973,372" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="924.912" y="308.0" width="96.176" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="973" y="324.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">reads owner</text><path d="M973,546 L973,442" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="908.424" y="484.0" width="129.152" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="973" y="500.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">reassigns ranges</text><rect x="50" y="516" width="1460" height="150" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#e05561" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="507" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#9e2b36">2 - REBALANCE - ONLY WHEN A SHARD GOES HOT</text><rect x="74" y="546" width="250" height="87" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(90,561) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/></g><text x="120" y="577" font-size="16.5" font-weight="700" fill="#8c5a0d">Load snapshot</text><text x="91" y="599.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">per-shard load,</text><text x="91" y="616.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">an input, not measured</text><rect x="461" y="546" width="250" height="87" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(477,561) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5"/><path d="M12 17.2v.1"/></g><text x="507" y="577" font-size="16.5" font-weight="700" fill="#9e2b36">Hot detection</text><text x="478" y="599.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">load x 100 x n  &gt;</text><text x="478" y="616.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">total x (100 + pct)</text><rect x="848" y="546" width="250" height="87" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(864,561) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="894" y="577" font-size="16.5" font-weight="700" fill="#552fae">Rebalance planner</text><text x="865" y="599.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">shed highest slots to</text><text x="865" y="616.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">coldest receiver first</text><rect x="1235" y="546" width="250" height="87" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1251,561) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.6 6H14a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8h.5"/></g><text x="1281" y="577" font-size="16.5" font-weight="700" fill="#186547">Plan</text><text x="1252" y="599.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">contiguous range moves</text><text x="1252" y="616.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">1024 slots -&gt; 3 moves</text><path d="M324,589 L461,589" stroke="#e0a13a" stroke-width="2.0" fill="none" marker-end="url(#ah-amber)"/><rect x="355.212" y="577.0" width="74.576" height="24.0" rx="12" fill="#ffffff" stroke="#e0a13a" stroke-opacity="0.4"/><text x="392.5" y="593.44" text-anchor="middle" font-size="12" font-weight="600" fill="#8c5a0d">snapshot</text><path d="M711,589 L848,589" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="748.26" y="577.0" width="62.480000000000004" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="779.5" y="593.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">hot list</text><path d="M1098,589 L1235,589" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="1117.62" y="577.0" width="97.76" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="1166.5" y="593.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">fill to ceiling</text><rect x="50" y="690" width="700" height="95.19999999999999" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="66" y="714" font-size="13.2" font-weight="700" fill="#3d4a63">Why a slot layer, not hash % shards</text><text x="66" y="736" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">hash % n bakes the shard count in - add a shard and almost every</text><text x="66" y="754.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">tenant remaps. A fixed slot layer moves slot ranges instead, so</text><text x="66" y="772.8" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">scaling reassigns ranges and never rehashes the whole keyspace.</text><rect x="810" y="690" width="700" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="826" y="714" font-size="13.2" font-weight="700" fill="#186547">One integer core, six languages</text><text x="826" y="736" font-size="12.4" fill="#186547" fill-opacity="0.92">FNV-1a, % 16384, and thresholds cleared by cross-multiplication keep</text><text x="826" y="754.4" font-size="12.4" fill="#186547" fill-opacity="0.92">Python, Go, Rust, C#, Java, TypeScript byte-for-byte identical.</text><text x="826" y="772.8" font-size="12.4" fill="#186547" fill-opacity="0.92">Vectors pin the slot, the owner, the hot list, and the exact plan.</text><text x="780.0" y="812" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/atlas</text></svg>